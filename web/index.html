<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 容器日志医生 · 诊断控制台</title>
<!--
  设计说明（工业终端 / 信号监控台 风格）
  ==========================================
  为什么选这个方向？
    使用者是运维工程师，界面要像「值班台」而不是「营销页」。
    所以：直角（2px 圆角）代替圆角卡片、等宽字体承载数据、
    用边框而不是阴影分隔层级、唯一的强调色是「信号青」。

  核心记忆点：
    顶部那条持续扫过的心跳信号线（SIGNAL / HEARTBEAT）。
    Mock 模式下它会变成琥珀色，一眼看出当前不是真实模型推理。

  刻意避开的设计俗套：
    ✗ 紫色渐变 + 白底        ✗ 12px 圆角卡片 + 柔和阴影
    ✗ 毛玻璃滥用             ✗ 蓝底白字按钮
    ✗ 纯黑/纯白背景          ✗ 默认系统字体堆叠

  零依赖：不引任何 CDN 字体/图标，断网也能完整显示（这是项目的一贯原则）。
-->
<style>
:root {
  /* ---- 兼容原有变量名（JS 模板里的内联样式引用了 --bg / --border / --text-dim）---- */
  --bg: #0b0e11;
  --card: #131a1f;
  --card-hover: #182128;
  --border: #232d35;
  --text: #e6edf3;
  --text-dim: #7d8b96;
  --green: #3fb950;
  --red: #f85149;
  --amber: #d29922;
  --blue: #58a6ff;
  --purple: #bc8cff;

  /* ---- 新增：工业终端风设计令牌 ---- */
  --accent: #2dd4bf;                    /* 信号青：全站唯一强调色 */
  --grid: rgba(45, 212, 191, 0.05);     /* 背景网格 */
  --radius: 2px;                        /* 直角感是工业风的关键 */
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", "JetBrains Mono", Consolas, "Liberation Mono", Menlo, monospace;
  --sans: ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }

body {
  min-height: 100vh;
  color: var(--text);
  font-family: var(--sans);
  font-size: 13.5px;
  line-height: 1.6;
  padding: 26px 22px 44px;
  -webkit-font-smoothing: antialiased;
  background-color: var(--bg);
  /* 技术网格 + 两处极淡的信号光晕（氛围层，不是渐变背景） */
  background-image:
    radial-gradient(880px 400px at 10% -10%, rgba(45, 212, 191, 0.10), transparent 62%),
    radial-gradient(680px 360px at 98% -4%, rgba(88, 166, 255, 0.055), transparent 60%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: auto, auto, 30px 30px, 30px 30px;
  background-attachment: fixed;
}

/* 极淡的扫描线，模拟监视器 */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: repeating-linear-gradient(180deg, rgba(255,255,255,.015) 0 1px, transparent 1px 4px);
}

.container { max-width: 1320px; margin: 0 auto; position: relative; z-index: 1; }

/* ============================ 顶栏 ============================ */
header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 20px; flex-wrap: wrap;
  padding-bottom: 15px; margin-bottom: 22px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
/* 底部那道青色高光，是全站的「信号基准线」 */
header::after {
  content: ""; position: absolute; left: 0; bottom: -1px; height: 1px; width: 150px;
  background: linear-gradient(90deg, var(--accent), rgba(45,212,191,0) 100%);
}

h1 {
  font-family: var(--mono);
  font-size: 19px; font-weight: 700; letter-spacing: .01em;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  color: #f2f8fb;
}
h1 .sub {
  font-family: var(--mono);
  font-size: 9.5px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
  color: var(--text-dim);
  border-left: 1px solid var(--border); padding-left: 12px;
}

.logo { width: 30px; height: 30px; color: var(--accent); flex: none; }

/* ---- 心跳信号线：本页的核心记忆点 ---- */
.topbar-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

.signal { display: flex; align-items: center; gap: 9px; color: var(--accent); }
.signal svg { width: 116px; height: 22px; display: block; }
.signal .trace-base { fill: none; stroke: currentColor; stroke-width: 1.25; opacity: .2; }
.signal .trace-run {
  fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 22 210;
  animation: sweep 2.6s linear infinite;
}
.signal span { font-family: var(--mono); font-size: 9px; letter-spacing: .22em; opacity: .7; }
/* Mock 模式：心跳转为琥珀色 —— 一眼看出「当前不是真实模型推理」 */
.signal.mock { color: var(--amber); }

@keyframes sweep { from { stroke-dashoffset: 232; } to { stroke-dashoffset: 0; } }

.badges { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .05em;
  padding: 5px 10px; border-radius: var(--radius);
  border: 1px solid var(--border); color: var(--text-dim);
  background: rgba(255, 255, 255, .022);
}
.badge::before {
  content: ""; width: 5px; height: 5px; border-radius: 50%;
  background: currentColor; flex: none;
}
.badge.mock { border-color: rgba(210,153,34,.42); color: var(--amber); }
.badge.live { border-color: rgba(63,185,80,.42); color: var(--green); }

/* ============================ 读数卡片 ============================ */
.cards {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
  gap: 10px; margin-bottom: 20px;
}
.card {
  position: relative; overflow: hidden;
  background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0) 72%), var(--card);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 14px 13px 16px;
  transition: border-color .18s, transform .18s;
}
/* 左侧那道竖条：hover 时会变长变亮，像仪表被激活 */
.card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: var(--text-dim); opacity: .3;
  transition: width .18s, background .18s, opacity .18s;
}
.card:hover { border-color: rgba(45,212,191,.42); transform: translateY(-2px); }
.card:hover::before { width: 3px; background: var(--accent); opacity: 1; }
.card .label {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .15em;
  text-transform: uppercase; color: var(--text-dim);
}
.card .value {
  font-family: var(--mono); font-size: 30px; font-weight: 700; line-height: 1.15;
  margin-top: 6px; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;   /* 数字等宽，跳动时不抖 */
}
.card .value.danger { color: var(--red); }
.card .value.warn   { color: var(--amber); }
.card .value.ok     { color: var(--green); }

/* ============================ 命令条 ============================ */
.toolbar {
  display: flex; gap: 9px; flex-wrap: wrap; align-items: center;
  padding: 10px 12px; margin-bottom: 16px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
}

button {
  font-family: var(--mono); font-size: 11.5px; letter-spacing: .04em;
  background: rgba(255,255,255,.035); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 8px 13px; cursor: pointer; white-space: nowrap;
  transition: background .16s, border-color .16s, color .16s, transform .08s;
}
button:hover { background: rgba(45,212,191,.12); border-color: rgba(45,212,191,.5); color: #d8fffa; }
button:active { transform: translateY(1px); }
button.primary { background: var(--accent); border-color: var(--accent); color: #04211d; font-weight: 700; }
button.primary:hover { background: #5eead4; border-color: #5eead4; color: #04211d; }
button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 搜索框做成终端提示符的样子 */
.prompt {
  flex: 1; min-width: 220px;
  display: flex; align-items: center; gap: 8px;
  background: rgba(0,0,0,.3); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 0 11px;
  transition: border-color .16s;
}
.prompt:focus-within { border-color: var(--accent); }
.prompt .caret { font-family: var(--mono); color: var(--accent); font-weight: 700; flex: none; }

input, select {
  font-family: var(--mono); font-size: 12px;
  background: transparent; color: var(--text);
  border: none; padding: 8px 0; width: 100%;
}
input::placeholder { color: #55636d; }
input:focus, select:focus { outline: none; }
select {
  width: auto; cursor: pointer; padding: 8px 10px;
  background: rgba(0,0,0,.3); border: 1px solid var(--border);
  border-radius: var(--radius);
}
select:hover { border-color: rgba(45,212,191,.42); }
select option { background: #131a1f; color: var(--text); }

/* ============================ 记录表 ============================ */
.list-head {
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--text-dim); padding: 0 2px 9px;
}
.list-head span:last-child { color: var(--accent); letter-spacing: .08em; }

table {
  width: 100%; border-collapse: separate; border-spacing: 0;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden;
}
th {
  background: rgba(0,0,0,.32); text-align: left;
  padding: 11px 14px; border-bottom: 1px solid var(--border);
  font-family: var(--mono); font-size: 9.5px; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase; color: var(--text-dim);
}
td { padding: 11px 14px; border-top: 1px solid var(--border); vertical-align: middle; }
tbody tr {
  cursor: pointer;
  transition: background .14s;
  animation: rowIn .34s cubic-bezier(.22,.8,.3,1) both;
}
tbody tr:hover { background: var(--card-hover); }
/* 每行左侧的严重度色条（行首那一竖条），hover 时统一高亮为信号青 */
td:first-child { box-shadow: inset 3px 0 0 transparent; transition: box-shadow .14s; }
tbody tr.sev-high   td:first-child { box-shadow: inset 3px 0 0 var(--red); }
tbody tr.sev-medium td:first-child { box-shadow: inset 3px 0 0 var(--amber); }
tbody tr.sev-low    td:first-child { box-shadow: inset 3px 0 0 var(--text-dim); }
tbody tr:hover td:first-child { box-shadow: inset 3px 0 0 var(--accent); }

/* 交错入场：逐行淡入，不做滚动动画（避免眩晕） */
@keyframes rowIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
tbody tr:nth-child(1)  { animation-delay: 0s; }
tbody tr:nth-child(2)  { animation-delay: .022s; }
tbody tr:nth-child(3)  { animation-delay: .044s; }
tbody tr:nth-child(4)  { animation-delay: .066s; }
tbody tr:nth-child(5)  { animation-delay: .088s; }
tbody tr:nth-child(6)  { animation-delay: .110s; }
tbody tr:nth-child(7)  { animation-delay: .132s; }
tbody tr:nth-child(8)  { animation-delay: .154s; }
tbody tr:nth-child(9)  { animation-delay: .176s; }
tbody tr:nth-child(10) { animation-delay: .198s; }

.mono { font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }

.tag {
  display: inline-block; padding: 3px 7px; border-radius: var(--radius);
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase;
  border: 1px solid transparent; white-space: nowrap;
}
.tag.high     { background: rgba(248,81,73,.14);  color: var(--red);       border-color: rgba(248,81,73,.35); }
.tag.medium   { background: rgba(210,153,34,.14); color: var(--amber);     border-color: rgba(210,153,34,.35); }
.tag.low      { background: rgba(139,148,158,.12);color: var(--text-dim);  border-color: rgba(139,148,158,.28); }
.tag.new      { background: rgba(88,166,255,.14); color: var(--blue);      border-color: rgba(88,166,255,.32); }
.tag.resolved { background: rgba(63,185,80,.14);  color: var(--green);     border-color: rgba(63,185,80,.32); }
.tag.ignored  { background: rgba(139,148,158,.12);color: var(--text-dim);  border-color: rgba(139,148,158,.28); }

.cause {
  color: var(--text-dim); max-width: 430px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.empty {
  text-align: center; padding: 62px 20px;
  font-family: var(--mono); font-size: 12px; line-height: 2.1;
  color: var(--text-dim);
  border: 1px dashed var(--border); border-radius: var(--radius);
  background: rgba(0,0,0,.16);
}

/* ============================ 详情弹窗 ============================ */
.modal {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(4,7,9,.82);
  overflow-y: auto; padding: 46px 20px;
}
.modal.show { display: block; }
.modal-content {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  max-width: 900px; margin: 0 auto; padding: 26px;
  box-shadow: 0 26px 70px rgba(0,0,0,.62), 0 0 0 1px rgba(45,212,191,.05);
  animation: modalIn .24s cubic-bezier(.22,.8,.3,1) both;
  counter-reset: sec;      /* 给下面的 .section 自动编号 */
}
@keyframes modalIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.modal-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 16px; padding-bottom: 16px; margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.modal-header h2 {
  font-family: var(--mono); font-size: 16px; font-weight: 700;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.close {
  background: none; border: 1px solid transparent; color: var(--text-dim);
  font-size: 20px; line-height: 1; padding: 2px 8px; cursor: pointer;
  border-radius: var(--radius); flex: none;
  transition: color .16s, border-color .16s;
}
.close:hover { color: var(--text); border-color: var(--border); background: none; }

.section { counter-increment: sec; margin-bottom: 22px; }
.section h3 {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--mono); font-size: 9.5px; font-weight: 500;
  letter-spacing: .18em; text-transform: uppercase;
  color: var(--text-dim); margin-bottom: 10px;
}
/* 章节自动编号 01 / 02 / 03 —— 纯 CSS，不用改 JS */
.section h3::before {
  content: counter(sec, decimal-leading-zero);
  color: var(--accent); font-weight: 700; letter-spacing: 0;
  border-right: 1px solid var(--border); padding-right: 10px;
}

pre {
  font-family: var(--mono); font-size: 11.5px; line-height: 1.65;
  background: rgba(0,0,0,.34); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px;
  overflow-x: auto; white-space: pre-wrap; word-break: break-word;
  color: #c9d6de;
}

.suggestion {
  background: rgba(0,0,0,.24); border: 1px solid var(--border);
  border-left: 2px solid var(--green);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 11px 14px; margin-bottom: 8px;
}
.suggestion strong {
  font-family: var(--mono); font-size: 11px;
  color: var(--green); letter-spacing: .04em;
}

.ref {
  background: rgba(0,0,0,.24); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 13px; margin-bottom: 9px;
}
.ref .ref-title {
  font-family: var(--mono); font-size: 11.5px; line-height: 1.5;
  color: var(--purple); margin-bottom: 7px;
}
.ref .ref-text {
  color: var(--text-dim); font-size: 11.5px;
  max-height: 132px; overflow-y: auto; white-space: pre-wrap;
}
.ref .score {
  float: right; font-family: var(--mono); font-size: 10.5px;
  color: var(--accent); border: 1px solid rgba(45,212,191,.3);
  border-radius: var(--radius); padding: 1px 6px;
}

/* ============================ 提示与页脚 ============================ */
.toast {
  position: fixed; bottom: 22px; right: 22px; z-index: 200; display: none;
  background: #0f1519; border: 1px solid var(--border);
  border-left: 3px solid var(--accent); border-radius: var(--radius);
  padding: 12px 16px; max-width: 430px;
  font-family: var(--mono); font-size: 12px; line-height: 1.5;
  box-shadow: 0 14px 36px rgba(0,0,0,.58);
  animation: toastIn .2s cubic-bezier(.22,.8,.3,1) both;
}
.toast.show { display: block; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.footer {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-top: 22px; padding-top: 14px;
  border-top: 1px solid var(--border);
  font-family: var(--mono); font-size: 11px; color: var(--text-dim);
}
.footer a {
  color: var(--accent); text-decoration: none;
  border-bottom: 1px solid rgba(45,212,191,.3);
  transition: border-color .16s;
}
.footer a:hover { border-bottom-color: var(--accent); }
.footer .dot { color: var(--border); }

/* ============================ 响应式与无障碍 ============================ */
@media (max-width: 760px) {
  body { padding: 16px 12px 32px; }
  h1 { font-size: 16px; }
  h1 .sub { display: none; }
  .signal { display: none; }          /* 窄屏优先保证信息密度 */
  .cards { grid-template-columns: repeat(auto-fit, minmax(136px, 1fr)); }
  .card .value { font-size: 24px; }
  .cause { max-width: 150px; }
  th, td { padding: 9px 10px; }
  .modal { padding: 20px 12px; }
  .modal-content { padding: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="2" fill="none"
              stroke="currentColor" stroke-width="1.5" opacity=".35"/>
        <path d="M5.5 21.5H10l2.6-10.5 3.4 15 2.6-9.5H26.5" fill="none"
              stroke="currentColor" stroke-width="2.1"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      AI 容器日志医生
      <span class="sub">Log Diagnostic Console</span>
    </h1>

    <div class="topbar-right">
      <!-- 心跳信号线：服务正常时持续扫过，Mock 模式下转为琥珀色 -->
      <div class="signal" id="signalBox" title="服务心跳">
        <svg viewBox="0 0 140 26" preserveAspectRatio="none" aria-hidden="true">
          <path class="trace-base"
                d="M0 13 H26 L31 4 L36 22 L41 13 H74 L79 7 L83 19 L87 13 H140"/>
          <path class="trace-run"
                d="M0 13 H26 L31 4 L36 22 L41 13 H74 L79 7 L83 19 L87 13 H140"/>
        </svg>
        <span>HEARTBEAT</span>
      </div>
      <div class="badges" id="badges"></div>
    </div>
  </header>

  <div class="cards" id="cards"></div>

  <div class="toolbar">
    <button class="primary" onclick="scanNow()">立即扫描</button>
    <button onclick="seedData()">生成演示数据</button>
    <button onclick="loadAll()">刷新</button>
    <label class="prompt">
      <span class="caret">&gt;</span>
      <input class="search-box" id="keyword" aria-label="搜索日志内容关键字"
             placeholder="搜索日志内容关键字，回车执行…"
             onkeydown="if(event.key==='Enter')loadList()">
    </label>
    <select id="statusFilter" onchange="loadList()" aria-label="按状态筛选">
      <option value="">全部状态</option>
      <option value="new">未处理</option>
      <option value="resolved">已解决</option>
      <option value="ignored">已忽略</option>
    </select>
    <select id="severityFilter" onchange="loadList()" aria-label="按等级筛选">
      <option value="">全部等级</option>
      <option value="high">高危</option>
      <option value="medium">中危</option>
      <option value="low">低危</option>
    </select>
  </div>

  <div id="listArea"></div>

  <div class="footer">
    <span>接口文档</span><a href="/docs" target="_blank" rel="noopener">/docs</a>
    <span class="dot">·</span>
    <span>RAG 检索测试</span><a href="/api/kb/search?q=Connection%20refused" target="_blank" rel="noopener">/api/kb/search</a>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function api(path, options = {}) {
  const res = await fetch(path, options);
  const data = await res.json();
  if (!res.ok) throw new Error(data.detail || '请求失败');
  return data;
}

async function loadBadges() {
  try {
    const [health, kb] = await Promise.all([
      api('/api/health'), api('/api/kb/info')
    ]);
    const d = health.data;
    const k = kb.data;
    const badges = [];
    if (d.mock_mode) {
      badges.push('<span class="badge mock">Mock 模式（未配置 API Key）</span>');
    } else {
      badges.push('<span class="badge live">大模型已接入</span>');
    }
    badges.push(`<span class="badge">向量库：${k.backend} / ${k.chunk_count} 片段</span>`);
    badges.push(`<span class="badge">向量化：${k.embedder}</span>`);
    $('badges').innerHTML = badges.join('');

    // 心跳信号线跟着运行模式变色：Mock = 琥珀，真实模型 = 信号青
    const sig = $('signalBox');
    if (sig) sig.classList.toggle('mock', !!d.mock_mode);
  } catch (e) {
    $('badges').innerHTML = '<span class="badge mock">接口未连接</span>';
  }
}

async function loadStats() {
  const res = await api('/api/stats');
  const s = res.data;
  const byStatus = s.by_status || {};
  const bySeverity = s.by_severity || {};
  const services = Object.keys(s.by_service || {}).length;

  $('cards').innerHTML = `
    <div class="card"><div class="label">诊断记录总数</div><div class="value">${s.total}</div></div>
    <div class="card"><div class="label">未处理</div><div class="value warn">${byStatus.new || 0}</div></div>
    <div class="card"><div class="label">高危问题</div><div class="value danger">${bySeverity.high || 0}</div></div>
    <div class="card"><div class="label">已解决</div><div class="value ok">${byStatus.resolved || 0}</div></div>
    <div class="card"><div class="label">监控服务数</div><div class="value">${services}</div></div>
  `;
}

async function loadList() {
  const params = new URLSearchParams({ limit: 50 });
  const kw = $('keyword').value.trim();
  const status = $('statusFilter').value;
  const severity = $('severityFilter').value;
  if (kw) params.append('keyword', kw);
  if (status) params.append('status', status);
  if (severity) params.append('severity', severity);

  const res = await api('/api/diagnoses?' + params.toString());
  const items = res.data.items;

  if (!items.length) {
    $('listArea').innerHTML = '<div class="empty">暂无诊断记录。<br>点击上方「立即扫描」或「生成演示数据」开始。</div>';
    return;
  }

  // 行上带 sev-* 类，CSS 才能给每行左侧画出对应的严重度色条
  const rows = items.map(it => `
    <tr class="sev-${it.severity}" onclick="showDetail(${it.id})">
      <td class="mono">#${it.id}</td>
      <td class="mono">${it.created_at}</td>
      <td>${it.service}</td>
      <td><span class="tag ${it.severity}">${it.severity}</span></td>
      <td><span class="tag ${it.status}">${it.status}</span></td>
      <td class="cause">${escapeHtml(it.root_cause || '-')}</td>
      <td>${(it.used_references || []).length}</td>
    </tr>
  `).join('');

  $('listArea').innerHTML = `
    <div class="list-head"><span>诊断记录</span><span>${items.length} RECORDS</span></div>
    <table>
      <thead><tr>
        <th>ID</th><th>时间</th><th>服务</th><th>等级</th>
        <th>状态</th><th>根因分析</th><th>参考</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

async function showDetail(id) {
  const res = await api('/api/diagnoses/' + id);
  const d = res.data;

  const suggestions = (d.suggestions || []).map((s, i) =>
    `<div class="suggestion"><strong>建议 ${i+1}：</strong>${escapeHtml(s)}</div>`
  ).join('') || '<div class="suggestion">暂无建议</div>';

  const refs = (d.used_references || []).map(r => `
    <div class="ref">
      <div class="ref-title">${escapeHtml(r.source)} · ${escapeHtml(r.title)}
        <span class="score">相似度 ${r.score}</span>
      </div>
      <div class="ref-text">${escapeHtml(r.text)}</div>
    </div>
  `).join('') || '<div class="ref">本次未检索到参考资料</div>';

  $('modalContent').innerHTML = `
    <div class="modal-header">
      <div>
        <h2>#${d.id} ${escapeHtml(d.service)}
          <span class="tag ${d.severity}">${d.severity}</span>
          <span class="tag ${d.status}">${d.status}</span>
        </h2>
        <div style="color:var(--text-dim);font-size:12px;margin-top:4px">
          ${d.created_at} · 来源 ${d.source} · 命中关键字「${escapeHtml(d.matched_keyword || '-')}」
        </div>
      </div>
      <button class="close" onclick="closeModal()">&times;</button>
    </div>

    <div class="section">
      <h3>根因分析</h3>
      <div style="padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)">
        ${escapeHtml(d.root_cause || '-')}
      </div>
    </div>

    <div class="section">
      <h3>处置建议</h3>
      ${suggestions}
    </div>

    <div class="section">
      <h3>RAG 参考来源（知识库检索结果）</h3>
      ${refs}
    </div>

    <div class="section">
      <h3>原始日志</h3>
      <pre>${escapeHtml(d.raw_log || '')}</pre>
    </div>

    <div style="display:flex;gap:10px">
      <button class="primary" onclick="resolve(${d.id})">标记已解决</button>
      <button onclick="remove(${d.id})">删除记录</button>
    </div>
  `;
  $('modal').classList.add('show');
}

function closeModal() { $('modal').classList.remove('show'); }

async function resolve(id) {
  await api('/api/diagnoses/' + id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'resolved' })
  });
  toast('已标记为解决');
  closeModal();
  loadAll();
}

async function remove(id) {
  if (!confirm('确定删除这条记录吗？')) return;
  await api('/api/diagnoses/' + id, { method: 'DELETE' });
  toast('已删除');
  closeModal();
  loadAll();
}

async function scanNow() {
  toast('正在扫描，请稍候...');
  try {
    const res = await api('/api/scan', { method: 'POST' });
    toast(res.message);
    loadAll();
  } catch (e) { toast('扫描失败：' + e.message); }
}

async function seedData() {
  // ⚠️ 二次确认 —— 这个操作是「破坏性」的：
  //   后端 /api/seed 默认带 clear=true，会先清空 diagnoses 整张表，
  //   包括从真实日志分析出来的记录，而且无法恢复。
  //   曾经因为这个按钮没有确认框，误点一次就丢掉了 33 条真实分析记录。
  const okToGo = confirm(
    '⚠️ 此操作会【清空数据库中的所有诊断记录】\n\n' +
    '包括从真实日志分析出来的结果，且无法恢复。\n\n' +
    '建议先备份：sh exec.sh backup\n\n' +
    '确定要继续吗？'
  );
  if (!okToGo) return;

  toast('正在生成演示数据...');
  try {
    const res = await api('/api/seed', { method: 'POST' });
    toast(res.message);
    loadAll();
  } catch (e) { toast('生成失败：' + e.message); }
}

async function loadAll() {
  await Promise.all([loadBadges(), loadStats(), loadList()]);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
loadAll();
</script>
</body>
</html>
