# ==========================================================
# CI 流水线：代码推送后自动测试 + 构建镜像
#
# 触发时机：push 到 main 分支，或提交 PR 到 main
# 查看结果：GitHub 仓库页面 → Actions 标签页
# ==========================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 防止同一个 PR 的多次推送重复排队，只跑最新那次
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 第一个 job：测试 ----------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'          # 缓存依赖，加快后续构建

      - name: 安装核心依赖
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.115.0 uvicorn==0.30.6 requests==2.32.3 \
                      python-dotenv==1.0.1 pydantic==2.9.2 pytest==8.3.3

      - name: 安装可选依赖（Chroma）
        # 这个包较重且可能需要编译，装不上也不应该让整个流水线失败，
        # 因为程序会自动降级为内存向量库。
        continue-on-error: true
        run: pip install chromadb==0.5.5

      - name: 运行单元测试
        run: pytest tests -v

      # ---------- 冒烟测试 ----------
      # 拆成独立步骤，失败时能一眼看出是哪一环出问题。
      # 显式指定 VECTOR_BACKEND=memory（内存向量库）：内存后端是项目的保底方案，
      # 必须在任何环境都能跑通，不该被「chromadb 装没装、装得好不好」影响。
      # Chroma 的兼容性单独放在最后一步验证。
      - name: 冒烟测试 - 构建知识库
        env:
          MOCK_MODE: 'true'
          VECTOR_BACKEND: 'memory'
        run: python -m src.main kb --force

      - name: 冒烟测试 - 生成演示数据
        env:
          MOCK_MODE: 'true'
          VECTOR_BACKEND: 'memory'
        run: python -m src.main seed --rounds 1

      - name: 冒烟测试 - 扫描诊断
        env:
          MOCK_MODE: 'true'
          VECTOR_BACKEND: 'memory'
        run: python -m src.main scan --no-docker

      # Chroma 是可选增强，装不上/用不了都不该阻塞流水线（程序会自动降级），
      # 所以这里 continue-on-error，只作为兼容性观察项。
      - name: 冒烟测试 - Chroma 后端兼容性（可选）
        continue-on-error: true
        env:
          MOCK_MODE: 'true'
          VECTOR_BACKEND: 'chroma'
        run: |
          rm -rf data
          python -m src.main kb --force

  # ---------- 第二个 job：构建并推送镜像 ----------
  build:
    needs: test                  # 测试通过才构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write            # 推送镜像到 GHCR 需要这个权限
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Docker 构建环境
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 容器镜像仓库（GHCR）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
